services:
  app:
    image: ghcr.io/fox3l/pixel-print-lab:latest
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - pixel-print-lab-data:/app/data
      - pixel-print-lab-storage:/app/storage
    env_file:
      - .env
    environment:
      ADMIN_EMAIL: "${ADMIN_EMAIL:?Set ADMIN_EMAIL in the .env file}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the .env file}"
      TRUST_PROXY: "true"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in the .env file}"

volumes:
  pixel-print-lab-data:
  pixel-print-lab-storage:
